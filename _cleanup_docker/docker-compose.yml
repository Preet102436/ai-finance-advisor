# One-command local trial setup: `docker compose up --build`.
# Starts Postgres (schema auto-applied from db/schema.sql on first run),
# the FastAPI backend, and the Vite frontend - no local Python, Node, or
# Postgres install required, just Docker. See QUICKSTART.md.
#
# This is for trying the app out locally, not production: the JWT secret
# and DB password below are shared placeholders, not private to anyone.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    # No host port published here - only the backend container needs to
    # reach Postgres, over the internal docker network, so there's nothing
    # to clash with if you already have a local Postgres on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: finance_advisor
      DB_USER: postgres
      DB_PASSWORD: devpassword
      JWT_SECRET_KEY: local-dev-secret-not-for-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      # Optional - the chat works fine without this (falls back to the
      # app's own rule-based reasoning). Set it in your shell before
      # running `docker compose up` if you want LLM-backed replies too.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
